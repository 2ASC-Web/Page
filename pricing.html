<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>2ASC Administración</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- Bootstrap CSS -->
    <link href="css/styles.css" rel="stylesheet" />

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        /* Fondo principal */
        .hero-section{
            background-image: url('assets/portada-2asc-2.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Capa oscura */
        .hero-section::before{
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.60);
        }

        /* Contenido sobre el overlay */
        .hero-content{
            position: relative;
            z-index: 2;
        }

        /* Navbar */
        .navbar-custom{
            background: transparent !important;
            padding-top: 20px;
        }

        /* Contenedor centrado */
        .message-container{
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* Caja del mensaje */
        .message-box{
            max-width: 700px;
            padding: 40px 30px;
            border-radius: 18px;
            backdrop-filter: blur(4px);
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
        }

        .message-box h1{
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .message-box p{
            color: #f1f1f1;
            font-size: 1.1rem;
            font-weight: 400;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        /* Botón sutil */
        .btn-home{
            display: inline-block;
            padding: 12px 28px;
            border-radius: 50px;
            text-decoration: none;
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.08);
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .btn-home:hover{
            background: #ffffff;
            color: #000000;
            transform: translateY(-2px);
        }

        @media (max-width: 768px){

            .message-box{
                padding: 30px 20px;
            }

            .message-box h1{
                font-size: 1.8rem;
            }

            .message-box p{
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <div class="hero-section">

        <!-- NAVBAR -->
        <nav class="navbar navbar-expand-lg navbar-dark navbar-custom hero-content">
            <div class="container px-4">
                <a class="navbar-brand" href="index.html">
                    <img src="assets/Logo2-ASC-t.png" 
                         alt="2ASC Administración" 
                         height="120">
                </a>
            </div>
        </nav>

        <!-- MENSAJE CENTRAL -->
        <div class="message-container hero-content">

            <div class="message-box">

                <h1>¡2ASC Agracede tu Preferencia!</h1>

                <p>
                    ¡Uno de nuestros asesores se pondrá en contacto contigo!
                </p>

                <a href="index.html" class="btn-home">
                    <i class="bi bi-arrow-left"></i>
                    Volver al inicio
                </a>

            </div>

        </div>

    </div>

</body>
</html>
