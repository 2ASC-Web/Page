<style>
/* BOTÓN */
#whatsapp-button {
    position: fixed;

}
/* CHAT */
#whatsapp-chat {
    position: fixed;
    bottom: 90px;

    width: 300px;
    background: #fff;
    border-radius: 15px;
    display: none;

    font-family: Arial, sans-serif;
}
/* HEADER */
#whatsapp-chat .header {
    background: #25D366;
    color: white;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#whatsapp-chat .header button {
    background: none;
    border: none;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

/* BODY */
#whatsapp-chat .body {
    padding: 20px;
    background: #f0f0f0;
}

#whatsapp-chat .body p {
    background: white;
    padding: 15px;
    border-radius: 15px;
    margin: 0;
}

/* FOOTER */

    padding: 15px;

}

    color: white;
    padding: 10px 15px;
    border-radius: 25px;
    text-decoration: none;
    font-weight: bold;
}
</style>

<script>
function toggleChat() {
    var chat = document.getElementById("whatsapp-chat");
    chat.style.display = (chat.style.display === "block") ? "none" : "block";
}
